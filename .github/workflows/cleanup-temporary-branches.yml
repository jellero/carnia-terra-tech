name: Cleanup temporary branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-temporary-branches.yml'

permissions:
  contents: write

jobs:
  delete-temporary-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete closure and correction branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "closure/dso-tica-20260918"
            "closure/dso-tica-v2-20260918"
            "closure/financial-consolidation-20260918"
            "closure/master-commissioning-20260918"
            "closure/master-commissioning-v2-20260918"
            "closure/master-load-register-20260918"
            "closure/master-load-register-v2-20260918"
            "closure/master-pilot-register-20260918"
            "closure/problematiche-rischi-20260918"
            "closure/problematiche-rischi-v2-20260918"
            "closure/procurement-register-20260918"
            "closure/validation-dashboard-20260918"
            "closure/validation-dashboard-v2-20260918"
            "correzione/rischi-tutto-italiano-20260918"
            "correzione/rischi-tutto-italiano-v2-20260918"
            "correzione/rischi-tutto-italiano-v3-20260918"
          )
          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            echo "Deleting $branch"
            gh api --method DELETE "repos/$REPO/git/refs/heads/$encoded" || true
          done
